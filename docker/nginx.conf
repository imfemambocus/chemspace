# pubchem's public DNS can change, so resolve upstream names at request time
resolver 1.1.1.1 8.8.8.8 valid=300s;

server {
  # 8080, not 80: the unprivileged nginx runs as a non-root user and cannot bind a
  # privileged (<1024) port. the container publishes this port instead.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # long-cache the hashed build assets; they are content-addressed so this is safe
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # proxy PubChem PUG REST, mirroring the Vite dev proxy: strip the /pubchem prefix,
  # rewrite Host, and send SNI so the upstream TLS handshake matches the real hostname.
  # the prefix strip must be an explicit rewrite: a proxy_pass with a variable upstream
  # (needed so the resolver picks up DNS at runtime) disables nginx's automatic strip,
  # so without this the full /pubchem/... path is forwarded and PubChem returns HTML.
  location /pubchem/ {
    set $pubchem "pubchem.ncbi.nlm.nih.gov";
    rewrite ^/pubchem/(.*)$ /$1 break;
    proxy_pass https://$pubchem;
    proxy_set_header Host $pubchem;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # single page app: unknown paths fall back to index.html (deep links like /?cid= work)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
